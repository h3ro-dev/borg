name: Verify BORG source

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Source and conductor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Verify exact public distribution
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/borg-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/borg-source"
          python3 -B "$RUNNER_TEMP/borg-source/installer/release_guard.py" \
            --root "$RUNNER_TEMP/borg-source" \
            --allowlist "$RUNNER_TEMP/borg-source/RELEASE-ALLOWLIST.json" \
            --inventory "$RUNNER_TEMP/borg-source/RELEASE-INVENTORY.json"
      - name: Verify release, adapter and installer guards
        run: python3 -B -m unittest installer.test_release_guard installer.test_adapters installer.test_startup_preflight
      - name: Install pinned native Codex runtime
        run: npm ci --prefix installer/npm --ignore-scripts --no-audit --no-fund
      - name: Check conductor syntax
        run: npm run check --prefix conductor
      - name: Test conductor and isolated native initialization
        working-directory: conductor
        env:
          BORG_TEST_CODEX_BIN: ${{ github.workspace }}/installer/npm/node_modules/.bin/codex
        run: node --test --test-concurrency=1 tests/*.test.mjs providers/*.test.mjs

  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: connector
            os: macos-14
            requirements: installer/requirements.lock
          - suite: coordination
            os: ubuntu-24.04
            requirements: coordination/requirements-core.lock
          - suite: installer
            os: macos-14
            requirements: installer/requirements.lock
          - suite: memory
            os: ubuntu-24.04
            requirements: memory/requirements.txt
          - suite: graph
            os: ubuntu-24.04
            requirements: graph/requirements.txt
          - suite: training
            os: ubuntu-24.04
            requirements: training/requirements.txt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install pinned suite dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.requirements }}" == "installer/requirements.lock" ]]; then
            python -m pip install --require-hashes -r "${{ matrix.requirements }}"
          else
            python -m pip install -r "${{ matrix.requirements }}"
          fi
      - name: Install pinned coordination test runtime
        if: matrix.suite == 'coordination'
        env:
          BORG_CI_RUNTIME_HOME: ${{ runner.temp }}/borg-coordination-runtime
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from installer.downloads import executable, unpack

          root = Path(os.environ["BORG_CI_RUNTIME_HOME"])
          unpack(root, "beads")
          print(executable(root, "beads", "bd"))
          PY
      - name: Prepare portable graph test fixture
        if: matrix.suite == 'graph'
        env:
          BORG_CI_GRAPH_HOME: ${{ runner.temp }}/borg-graph-fixture
        run: |
          PYTHONPATH=graph/tests python -B - <<'PY'
          import os
          from pathlib import Path
          from test_portable_graph import install_fixture

          install_fixture(Path(os.environ["BORG_CI_GRAPH_HOME"]))
          PY
      - name: Run ${{ matrix.suite }} suite
        shell: bash
        run: |
          case "${{ matrix.suite }}" in
            connector)
              PYTHONPATH=connector python -B -m unittest discover -s connector -p 'test_*.py'
              ;;
            coordination)
              PATH="$RUNNER_TEMP/borg-coordination-runtime/runtime/beads:$PATH" \
                PYTHONPATH=coordination python -B -m unittest discover -s coordination/tests -p 'test_*.py'
              PATH="$RUNNER_TEMP/borg-coordination-runtime/runtime/beads:$PATH" \
                PYTHONPATH=coordination python -B -m unittest discover -s coordination/comms/hub/tests -p 'test_*.py'
              ;;
            installer)
              python -B -m unittest discover -s installer -p 'test_*.py'
              ;;
            memory)
              python -B -m unittest discover -s memory/tests -p 'test_*.py'
              ;;
            graph)
              BORG_HOME="$RUNNER_TEMP/borg-graph-fixture" GRAPH_FEED_LIVE=1 \
                python -B -m unittest discover -s graph/tests -p 'test_*.py'
              ;;
            training)
              python -B -m unittest discover -s training/tests -p 'test_*.py'
              ;;
          esac
