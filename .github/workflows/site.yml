name: Publish BORG Collective website
on:
  push:
    branches: [master]
    paths: [site/**, platform/**, .github/workflows/site.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: borg-collective-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify machine planning contract
        run: |
          node --check site/app.js
          node --check site/guide.js
          node site/verify-links.mjs
          node --test platform/planner.test.mjs
          python3 borg.py blueprint inspect platform/examples/single-node.json
          python3 borg.py blueprint inspect platform/examples/build-fleet.json
      - name: Stage public website files
        run: |
          mkdir -p _site/assets _site/platform
          cp site/index.html site/styles.css site/app.js site/scene.js _site/
          cp site/configure.css site/configure.mjs _site/
          cp site/fleet.css site/guide.html site/guide.css site/guide.js _site/
          cp site/llms.txt site/agent-guide.md _site/
          cp platform/catalog.json platform/planner.mjs _site/platform/
          cp -R site/assets/. _site/assets/
          cp -R site/vendor _site/vendor
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
